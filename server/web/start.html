<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Streamer</title>
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center;
         justify-content: center; gap: 48px; background: #101418; color: #eee;
         font: 32px/1.3 system-ui, "Liberation Sans", sans-serif; }
  h1 { margin: 0; font-size: 56px; font-weight: 600; }
  nav { display: flex; gap: 40px; }
  a { display: flex; align-items: center; justify-content: center; width: 340px; height: 200px;
      border-radius: 20px; background: #1f2730; color: #fff; text-decoration: none;
      font-size: 44px; font-weight: 600; outline: none; border: 6px solid transparent; }
  a:focus { border-color: #fff; transform: scale(1.05); }
  p { margin: 0; color: #8a96a3; font-size: 26px; }
</style>
</head>
<body>
<h1>What do you want to watch?</h1>
<nav>
  <a href="https://www.netflix.com/browse">Netflix</a>
  <a href="https://www.peacocktv.com/">Peacock</a>
  <a href="https://tubitv.com/">Tubi</a>
  <a href="https://watch.sling.com/dashboard/on_demand/on_demand_all">Sling</a>
</nav>
<p>Left and right to choose, OK to open.</p>
<script>
  const links = [...document.querySelectorAll("a")];
  links[0].focus();
  document.addEventListener("keydown", (e) => {
    const i = links.indexOf(document.activeElement);
    const step = { ArrowLeft: -1, ArrowUp: -1, ArrowRight: 1, ArrowDown: 1 }[e.key];
    if (step) {
      links[(i + step + links.length) % links.length].focus();
      e.preventDefault();
    }
  });
</script>
</body>
</html>
