[supervisord]
user=root
environment=HOME="/config",XDG_RUNTIME_DIR="/tmp/pulse"
logfile=/dev/null
pidfile=/tmp/supervisord.pid
logfile_maxbytes=0

[program:xvfb]
; 20px taller than what is streamed: a hidden strip to park the mouse pointer in.
command=/usr/bin/Xvfb :99 -screen 0 1920x1100x24 -nolisten tcp
user=streamer
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:pulse]
command=/usr/local/bin/start-pulse.sh
user=streamer
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
command=/usr/bin/openbox
user=streamer
priority=20
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

[program:chrome]
command=/usr/local/bin/start-chrome.sh
user=streamer
priority=30
autorestart=true
startsecs=5
stdout_logfile=/dev/null
redirect_stderr=true

[program:vnc]
command=/usr/local/bin/start-vnc.sh
user=streamer
priority=40
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5900
user=streamer
priority=40
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

[program:server]
command=/usr/bin/python3 -u /app/server/streamer.py
user=streamer
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
